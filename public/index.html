<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Is It Good? — Surf Forecast</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Loaded before app.js so SURF_CONFIG is available at startup.
       Edit js/surf-config.js to point at R2 for Vercel deployment. -->
  <script src="js/surf-config.js"></script>
</head>
<body>
  <!-- Map -->
  <div id="map"></div>

  <!-- Particle canvases (overlaid on map) -->
  <canvas id="wind-canvas"></canvas>
  <canvas id="swell-canvas"></canvas>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="logo">
      <span class="logo-text" id="site-name">Is It Good?</span>
    </div>

    <div class="controls-group">
      <!-- Hidden until an ECMWF pipeline exists: only GFS runs in CI, and
           prod pins MANIFEST_URL to GFS, so the toggle was misleading. -->
      <div class="btn-group" id="model-selector" style="display:none">
        <button class="ctrl-btn active" data-model="gfs">GFS</button>
        <button class="ctrl-btn" data-model="ecmwf">ECMWF</button>
      </div>

      <div class="divider" style="display:none"></div>

      <div class="btn-group" id="layer-selector">
        <button class="ctrl-btn active" data-layer="wind">Wind</button>
        <button class="ctrl-btn" data-layer="swell">Swell</button>
      </div>

      <!-- Swell sub-layer: shown only while the swell layer is active and the
           run has partitioned data (hidden for old runs without swellpart) -->
      <div class="btn-group swell-mode-group" id="swell-mode-selector" style="display:none">
        <button class="ctrl-btn active" data-swellmode="combined">Combined</button>
        <button class="ctrl-btn" data-swellmode="ground">Groundswell</button>
        <button class="ctrl-btn" data-swellmode="windsea">Windsea</button>
      </div>

      <div class="divider"></div>

      <button class="ctrl-btn" id="pumping-btn" title="Global top 100">where its pumping</button>
    </div>

    <div class="hint" id="hint">Click coast for surf rating</div>
    <div class="status" id="status">Loading...</div>
  </header>

  <!-- Timeline bar -->
  <div class="timeline-bar">
    <button class="play-btn" id="play-btn" title="Play/Pause">
      <svg id="play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <svg id="pause-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none">
        <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
      </svg>
    </button>
    <div class="timeline-track">
      <!-- Index-based slider over the non-uniform hour list in js/hours.js
           (0-168h @3h then 174-336h @6h). min/max are re-asserted from
           N_STEPS at init in ui.js; 84 = last index of the 85-step list. -->
      <input type="range" id="hour-slider" min="0" max="84" step="1" value="0">
      <div class="timeline-ext-label" id="timeline-ext-label" aria-hidden="true">extended</div>
      <div class="timeline-ticks" id="timeline-ticks"></div>
    </div>
    <div class="hour-display" id="hour-display">
      <div class="hour-label">Now</div>
      <div class="hour-date" id="hour-date"></div>
    </div>
  </div>

  <!-- Wind speed legend -->
  <div class="legend" id="wind-legend">
    <div class="legend-title">Wind (m/s)</div>
    <div class="legend-bar" id="wind-legend-bar"></div>
    <div class="legend-labels" id="wind-legend-labels"></div>
  </div>

  <!-- Swell height legend -->
  <div class="legend swell-legend" id="swell-legend" style="display:none">
    <div class="legend-title">Swell (m)</div>
    <div class="legend-bar" id="swell-legend-bar"></div>
    <div class="legend-labels" id="swell-legend-labels"></div>
  </div>

  <!-- Surf rating panel -->
  <div class="rating-panel" id="rating-panel">
    <button class="close-btn" id="rating-close">&times;</button>
    <div class="rating-body"></div>
  </div>

  <!-- Where it's pumping panel -->
  <div id="pumping-panel" class="pumping-panel" aria-hidden="true">
    <div class="pumping-header">
      <h2 class="pumping-title">where its pumping</h2>
      <button class="pumping-close" id="pumping-close" aria-label="Close">&times;</button>
    </div>
    <div class="pumping-tabs" role="tablist">
      <button class="pumping-tab active" data-mode="now">right now</button>
      <button class="pumping-tab" data-mode="week">score this week</button>
      <button class="pumping-tab" data-mode="next">score next week</button>
    </div>
    <div class="pumping-source-tabs" role="tablist">
      <button class="pumping-source-tab active" data-source="known">known</button>
      <button class="pumping-source-tab" data-source="mysto">mysto</button>
    </div>
    <div class="pumping-status" id="pumping-status">Loading...</div>
    <div class="pumping-list" id="pumping-list"></div>
  </div>
  <div id="pumping-backdrop" class="pumping-backdrop" aria-hidden="true"></div>

  <!-- Upload sheet -->
  <div class="upload-backdrop" id="upload-backdrop" hidden></div>
  <div class="upload-sheet" id="upload-sheet" hidden>
    <div class="upload-head">
      <h3>Add spot media</h3>
      <button class="close-btn" id="upload-close">&times;</button>
    </div>
    <div class="upload-body">
      <input type="file" id="upload-file" accept="image/jpeg,image/png,video/mp4,video/quicktime">
      <div class="upload-preview" id="upload-preview"></div>
      <div class="upload-meta">
        <label>Captured <input type="datetime-local" id="upload-time"></label>
        <div class="upload-stamp-tag" id="upload-stamp-tag"></div>
      </div>
      <div class="upload-minimap" id="upload-minimap"></div>
      <input type="text" id="upload-caption" maxlength="140" placeholder="Caption (optional)">
      <button class="ctrl-btn" id="upload-submit" disabled>Upload</button>
      <div class="upload-status" id="upload-status"></div>
    </div>
  </div>

  <!-- Sign-in modal -->
  <div class="signin-modal" id="signin-modal" hidden>
    <div class="signin-box">
      <h3>Sign in to upload</h3>
      <p>We'll email you a one-time link.</p>
      <input type="email" id="signin-email" placeholder="you@example.com">
      <button class="ctrl-btn" id="signin-send">Send link</button>
      <div class="signin-status" id="signin-status"></div>
      <button class="close-btn" id="signin-close">&times;</button>
    </div>
  </div>


  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
